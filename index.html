<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Latino Refi Group</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">

<style>
body{
font-family:'Poppins',sans-serif;
background:#081120;
color:white;
margin:0;
}

.container{
max-width:1100px;
margin:auto;
padding:20px;
}

h1{
font-size:42px;
}

.hero{
text-align:center;
padding:60px 20px;
}

.form-box{
background:#1e293b;
padding:30px;
border-radius:20px;
max-width:450px;
margin:auto;
}

input,select{
width:100%;
padding:15px;
margin:10px 0;
border:none;
border-radius:10px;
background:#334155;
color:white;
}

button{
padding:15px;
border:none;
border-radius:10px;
cursor:pointer;
font-weight:bold;
}

.next-btn{
background:#10b981;
width:100%;
}

.back-btn{
background:#475569;
width:100%;
margin-top:10px;
}

.success{
display:none;
text-align:center;
padding:40px;
}

.lang{
position:absolute;
top:20px;
right:20px;
}

.lang button{
margin-left:5px;
}
</style>
</head>

<body>

<div class="lang">
<button onclick="setLang('en')">EN</button>
<button onclick="setLang('es')">ES</button>
</div>

<div class="hero">
<h1 id="title">Check If You Qualify To Lower Your Mortgage</h1>
<p id="desc">It takes less than 30 seconds. No impact on your credit.</p>
</div>

<div class="container">

<div class="form-box" id="formBox">

<form id="leadForm" action="https://formsubmit.co/latinorefigroup@gmail.com" method="POST">

<input type="hidden" name="_captcha" value="false">
<input type="hidden" name="_subject" value="NEW REFI LEAD">
<input type="hidden" name="_template" value="table">

<div class="step" id="step1">
<input type="text" name="Name" id="name" placeholder="Full Name" required>
<button type="button" class="next-btn" onclick="nextStep(1)">Next</button>
</div>

<div class="step" id="step2" style="display:none;">
<input type="tel" name="Phone" id="phone" placeholder="Phone Number" required>
<button type="button" class="next-btn" onclick="nextStep(2)">Next</button>
<button type="button" class="back-btn" onclick="prevStep(2)">Back</button>
</div>

<div class="step" id="step3" style="display:none;">
<select name="Goal" id="goal">
<option value="">Select Goal</option>
<option>Lower Payment</option>
<option>Cash Out</option>
<option>Both</option>
</select>
<button type="button" class="next-btn" onclick="nextStep(3)">Next</button>
<button type="button" class="back-btn" onclick="prevStep(3)">Back</button>
</div>

<div class="step" id="step4" style="display:none;">
<select name="Credit">
<option value="">Credit Score</option>
<option>Excellent</option>
<option>Good</option>
<option>Fair</option>
<option>Poor</option>
</select>
<button type="submit" class="next-btn">See If I Qualify</button>
<button type="button" class="back-btn" onclick="prevStep(4)">Back</button>
</div>

</form>

</div>

<div class="success" id="successBox">
<h2>✅ Submitted!</h2>
<p>We will contact you shortly.</p>
</div>

</div>

<script>

function nextStep(step){

if(step === 1){
let name = document.getElementById("name").value;
if(name.length < 3){
alert("Enter valid name");
return;
}
}

if(step === 2){
let phone = document.getElementById("phone").value;
if(phone.length < 8){
alert("Enter valid phone");
return;
}
}

document.getElementById("step"+step).style.display="none";
document.getElementById("step"+(step+1)).style.display="block";
}

function prevStep(step){
document.getElementById("step"+step).style.display="none";
document.getElementById("step"+(step-1)).style.display="block";
}

document.getElementById("leadForm").addEventListener("submit", function(){
document.getElementById("formBox").style.display="none";
document.getElementById("successBox").style.display="block";
});

function setLang(lang){

if(lang==="es"){
document.getElementById("title").innerText="Verifica Si Calificas Para Bajar Tu Hipoteca";
document.getElementById("desc").innerText="Toma menos de 30 segundos. Sin impacto en tu crédito.";
}
else{
location.reload();
}

}

</script>

</body>
</html>
