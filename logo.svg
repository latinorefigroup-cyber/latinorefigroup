<svg width="200" height="60" viewBox="0 0 200 60" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#059669;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#047857;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f0fdf4;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Logo icon background -->
  <circle cx="25" cy="30" r="22" fill="url(#logoGradient)" filter="url(#glow)"/>

  <!-- House icon -->
  <g transform="translate(13, 18)">
    <!-- House base -->
    <rect x="5" y="12" width="14" height="10" fill="white" rx="1"/>
    <!-- Roof -->
    <polygon points="2,12 12,2 22,12" fill="#fbbf24"/>
    <!-- Door -->
    <rect x="9" y="17" width="4" height="5" fill="#374151"/>
    <!-- Windows -->
    <rect x="6" y="14" width="2" height="2" fill="#60a5fa"/>
    <rect x="14" y="14" width="2" height="2" fill="#60a5fa"/>
  </g>

  <!-- Text -->
  <text x="55" y="25" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="url(#textGradient)">Latino Refi</text>
  <text x="55" y="42" font-family="Arial, sans-serif" font-size="12" fill="#10b981" font-weight="600">Group</text>

  <!-- Decorative elements -->
  <circle cx="180" cy="15" r="3" fill="#10b981" opacity="0.6"/>
  <circle cx="185" cy="25" r="2" fill="#059669" opacity="0.4"/>
  <circle cx="175" cy="35" r="2.5" fill="#047857" opacity="0.5"/>
</svg>